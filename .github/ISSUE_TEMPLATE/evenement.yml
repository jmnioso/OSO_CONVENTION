name: Suggérer un événement ou une correction
description: Proposer une date officielle à ajouter ou corriger dans l’agenda.
title: "[Agenda] "
body:
  - type: input
    id: name
    attributes:
      label: Nom de l’événement
    validations:
      required: true
  - type: input
    id: dates
    attributes:
      label: Dates de début et de fin
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Ville et lieu
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Lien vers l’annonce officielle
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Catégorie, description ou correction à apporter
